[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23.1.0",
    "fastapi>=0.139.2",
    "pyjwt>=2.10.1",
    "pre-commit>=4.6.1",
    "ruff>=0.16.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "argon2>=0.1.10",
    "user-agents>=2.2.0",
    "pydantic[email]>=2.13.4",
]

[tool.ruff.lint]
ignore = ["UP047","B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
