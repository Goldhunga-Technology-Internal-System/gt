[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gt"
version = "0.1.0"
description = "Batteries-included authentication framework for FastAPI."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Goldhunga Technology" },
]
keywords = [
    "authentication",
    "auth",
    "fastapi",
    "sqlalchemy",
    "alembic",
    "sessions",
    "jwt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Session",
]
dependencies = [
    "argon2-cffi>=23.1.0",
    "fastapi>=0.139.2",
    "pyjwt>=2.10.1",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "argon2>=0.1.10",
    "user-agents>=2.2.0",
    "pydantic[email]>=2.13.4",
]

[project.urls]
Homepage = "https://github.com/Goldhunga-Technology-Internal-System/gt"
Repository = "https://github.com/Goldhunga-Technology-Internal-System/gt.git"
Issues = "https://github.com/Goldhunga-Technology-Internal-System/gt/issues"

[tool.ruff.lint]
ignore = ["UP047","B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
